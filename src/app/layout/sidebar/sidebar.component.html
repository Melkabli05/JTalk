<nav aria-label="Primary" appAriaCurrent>
  <p-menu [model]="[...items()]" ariaLabel="Primary">
    <ng-template #start><ng-content select="[brand]" /></ng-template>
  </p-menu>
</nav>

<div class="foot">
  @if (room(); as current) {
    @if (!viewing()) {
      <app-current-room-card class="go-live" [room]="current" (back)="backToRoom.emit()" />
    }
  } @else {
    <div class="go-live">
      <app-live-waves />
      <p-card aria-label="Go live">
        <ng-template #title>Go live</ng-template>
        <ng-template #subtitle>Start a room and let people practise with you.</ng-template>
        <ng-template #footer>
          <button
            pButton
            type="button"
            icon="pi pi-plus"
            [fluid]="true"
            label="Start a room"
            (click)="startRoom.emit()"
          ></button>
        </ng-template>
      </p-card>
    </div>
  }

  <button
    pButton
    type="button"
    class="account"
    severity="secondary"
    aria-haspopup="menu"
    [text]="true"
    [attr.aria-label]="name() ? `Account menu, ${name()}` : 'Account menu'"
    (click)="menu.toggle($event)"
  >
    @if (picture(); as image) {
      <p-avatar shape="circle" aria-hidden="true" [image]="image" />
    } @else if (name()) {
      <p-avatar shape="circle" aria-hidden="true" [label]="name() | initials" />
    } @else {
      <p-avatar shape="circle" aria-hidden="true" icon="pi pi-user" />
    }
    <span class="who" aria-hidden="true">
      <strong>{{ name() || 'Your account' }}</strong>
      <small>{{ languages() }}</small>
    </span>
    <i class="pi pi-angle-up chevron" aria-hidden="true"></i>
  </button>
  <p-menu #menu appendTo="body" [popup]="true" [model]="[...accountItems()]" />
</div>
