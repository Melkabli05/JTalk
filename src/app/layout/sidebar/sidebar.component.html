<nav aria-label="Primary" appAriaCurrent>
  <p-menu [model]="[...items()]" ariaLabel="Primary">
    <ng-template #start><ng-content select="[brand]" /></ng-template>
  </p-menu>
</nav>

<div class="foot">
  @if (room(); as current) {
    @if (!viewing()) {
      <app-current-room-card class="go-live" [room]="current" (back)="backToRoom.emit()" />
    }
  } @else {
    <div class="go-live">
      <app-live-waves />
      <p-card aria-label="Go live">
        <ng-template #title>Go live</ng-template>
        <ng-template #subtitle>Start a room and let people practise with you.</ng-template>
        <ng-template #footer>
          <button
            pButton
            type="button"
            icon="pi pi-plus"
            [fluid]="true"
            label="Start a room"
            (click)="startRoom.emit()"
          ></button>
        </ng-template>
      </p-card>
    </div>
  }

  <div class="theme">
    <span id="dark-label">Dark theme</span>
    <p-toggleswitch
      ariaLabelledBy="dark-label"
      [ngModel]="dark()"
      (ngModelChange)="toggleDark.emit()"
    />
  </div>

  <div class="me">
    <button
      pButton
      type="button"
      class="account"
      severity="secondary"
      [text]="true"
      aria-label="Profile and settings"
      (click)="profile.emit()"
    >
      @if (picture(); as image) {
        <p-avatar shape="circle" size="normal" aria-hidden="true" [image]="image" />
      } @else {
        <p-avatar shape="circle" size="normal" aria-hidden="true" icon="pi pi-user" />
      }
      <span class="who" aria-hidden="true">
        <strong>{{ name() }}</strong>
        <small>{{ languages() }}</small>
      </span>
    </button>
    <button
      pButton
      type="button"
      class="sign-out"
      icon="pi pi-sign-out"
      severity="secondary"
      pTooltip="Sign out"
      tooltipPosition="top"
      [text]="true"
      [rounded]="true"
      aria-label="Sign out"
      (click)="signOut.emit()"
    ></button>
  </div>
</div>
