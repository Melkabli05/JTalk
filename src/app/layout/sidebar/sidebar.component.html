<nav [attr.aria-label]="'Primary' | t" appAriaCurrent>
  <p-menu [model]="[...items()]" [ariaLabel]="'Primary' | t">
    <ng-template #start><ng-content select="[brand]" /></ng-template>
  </p-menu>
</nav>

<p-card class="go-live" [attr.aria-label]="heading() | t">
  <ng-template #title>{{ heading() | t }}</ng-template>
  <ng-template #subtitle>
    @if (room(); as current) {
      <span class="room">
        <p-tag severity="success" [rounded]="true" [value]="'Live' | t" />
        {{ current.title }}
      </span>
    } @else {
      {{ 'Start a room and let people practise with you.' | t }}
    }
  </ng-template>
  <ng-template #footer>
    @if (room()) {
      <button
        pButton
        type="button"
        [fluid]="true"
        [label]="'Back to the room' | t"
        (click)="backToRoom.emit()"
      ></button>
    } @else {
      <button
        pButton
        type="button"
        icon="pi pi-plus"
        [fluid]="true"
        [label]="'Start a room' | t"
        (click)="startRoom.emit()"
      ></button>
    }
  </ng-template>
</p-card>

<button
  pButton
  type="button"
  class="account"
  severity="secondary"
  aria-haspopup="dialog"
  [text]="true"
  [attr.aria-label]="'Profile and settings' | t"
  (click)="settings.emit($event)"
>
  @if (picture(); as image) {
    <p-avatar shape="circle" size="large" aria-hidden="true" [image]="image" />
  } @else {
    <p-avatar shape="circle" size="large" aria-hidden="true" icon="pi pi-user" />
  }
  <span class="who" aria-hidden="true">
    <strong>{{ name() }}</strong>
    <small>{{ languages() }}</small>
  </span>
</button>
