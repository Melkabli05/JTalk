<a class="skip-link" href="#main-content">Skip to main content</a>

@if (navigating()) {
  <p-progressbar class="navigation-progress" mode="indeterminate" aria-label="Loading page" />
}

<ng-template #brand>
  <a class="brand" routerLink="/">
    <app-brand-mark />
    {{ appName }}
  </a>
</ng-template>

<app-sidebar
  class="rail"
  [items]="navItems"
  [name]="identity.profile()?.name ?? ''"
  [languages]="myLanguages()"
  [picture]="myPicture()"
  [room]="inRoom()"
  [viewing]="onRoomPage()"
  (startRoom)="startRoom()"
  (backToRoom)="backToRoom()"
  (profile)="openProfile()"
  [dark]="colorScheme.isDark()"
  (toggleDark)="colorScheme.toggle()"
  (signOut)="identity.signOut()"
>
  <ng-container ngProjectAs="[brand]" [ngTemplateOutlet]="brand" />
</app-sidebar>

@if (!onRoomAddress()) {
  <nav class="top" aria-label="Primary" appAriaCurrent>
    <p-menubar breakpoint="0px" [model]="topItems()" ariaLabel="Primary">
      <ng-template #start><ng-container [ngTemplateOutlet]="brand" /></ng-template>
    </p-menubar>
  </nav>
}

<main id="main-content" class="main" [class.wide]="wide()" tabindex="-1">
  @if (breadcrumbs().length > 0) {
    <p-breadcrumb
      class="breadcrumb"
      [model]="breadcrumbs()"
      [pt]="{ root: { 'aria-label': 'Breadcrumb' } }"
    />
  }
  @if (!identity.needsProfile()) {
    <router-outlet />
  }
</main>

@defer (when identity.needsProfile()) {
  <app-profile-dialog
    [visible]="identity.needsProfile()"
    [busy]="creating.submitting()"
    [error]="creating.error()"
    (saved)="saveProfile($event)"
  />
}
