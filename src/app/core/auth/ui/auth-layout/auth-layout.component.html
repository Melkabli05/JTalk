<div class="auth">
  <aside class="poster" aria-hidden="true">
    <p class="poster-brand"><app-brand-mark /> {{ appName | t }}</p>
    <p class="slogan">{{ 'Say it out loud.' | t }}</p>
    <app-voice-bubbles class="bubbles" />
  </aside>

  <main class="panel">
    <div class="content">
      <app-locale-switch class="locale" [(locale)]="locale" />
      <h1>{{ heading() }}</h1>
      @if (lead(); as text) {
        <p class="lead">{{ text }}</p>
      }
      <ng-content />
    </div>
  </main>
</div>
