<form class="form" [formRoot]="profileForm">
  <app-text-field label="Your name" autocomplete="nickname" [formField]="profileForm.name" />
  <app-avatar-picker label="Choose your picture" [formField]="profileForm.avatar" />

  <div class="pair">
    <app-select-field
      label="I speak"
      [options]="languages"
      [formField]="profileForm.nativeLanguage"
    />
    <app-select-field
      label="I am learning"
      [options]="languages"
      [formField]="profileForm.learning"
    />
  </div>

  <app-select-field
    label="Where you live"
    [options]="countries()"
    [formField]="profileForm.countryCode"
  />
  <app-textarea-field label="About you" [formField]="profileForm.bio" />

  <div class="actions">
    <button
      pButton
      type="submit"
      size="large"
      [loading]="busy()"
      [label]="profile() ? 'Save' : 'Continue'"
    ></button>
  </div>
</form>
