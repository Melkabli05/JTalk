<form class="form" [formRoot]="profileForm">
  <app-text-field
    [label]="'Your name' | t"
    autocomplete="nickname"
    [formField]="profileForm.name"
  />
  <app-avatar-picker [label]="'Choose your picture' | t" [formField]="profileForm.avatar" />

  <div class="pair">
    <app-select-field
      [label]="'I speak' | t"
      [options]="languages"
      [formField]="profileForm.nativeLanguage"
    />
    <app-select-field
      [label]="'I am learning' | t"
      [options]="languages"
      [formField]="profileForm.learning"
    />
  </div>

  <app-select-field
    [label]="'Where you live' | t"
    [options]="countries()"
    [formField]="profileForm.countryCode"
  />
  <app-textarea-field [label]="'About you' | t" [formField]="profileForm.bio" />

  <div class="actions">
    <button
      pButton
      type="submit"
      size="large"
      [loading]="busy()"
      [label]="profile() ? ('Save' | t) : ('Continue' | t)"
    ></button>
  </div>
</form>
