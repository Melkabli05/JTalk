<form class="form" [formRoot]="resetForm">
  @if (error(); as message) {
    <p-message severity="error">{{ message | t }}</p-message>
  }

  <app-password-field
    [label]="'New password' | t"
    autocomplete="new-password"
    [hint]="'At least {min} characters.' | t: { min: minLength }"
    [formField]="resetForm.password"
  />

  <div class="actions">
    <button
      pButton
      type="submit"
      [label]="'Set new password' | t"
      [loading]="submitting()"
      [disabled]="submitting()"
    ></button>
  </div>
</form>
