<form class="form" [formRoot]="loginForm">
  @if (error(); as message) {
    <p-message severity="error">{{ message | t }}</p-message>
  }

  <app-text-field
    [label]="'Email' | t"
    type="email"
    autocomplete="username"
    [formField]="loginForm.email"
  />
  <app-password-field
    [label]="'Password' | t"
    autocomplete="current-password"
    [formField]="loginForm.password"
  />

  <div class="actions">
    <button
      pButton
      type="submit"
      [label]="'Sign in' | t"
      [loading]="submitting()"
      [disabled]="submitting()"
    ></button>
  </div>
</form>
