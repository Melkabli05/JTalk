<form class="form" [formRoot]="forgotForm">
  @if (error(); as message) {
    <p-message severity="error">{{ message | t }}</p-message>
  }

  <app-text-field
    [label]="'Email' | t"
    type="email"
    autocomplete="email"
    [formField]="forgotForm.email"
  />

  <div class="actions">
    <button
      pButton
      type="submit"
      [label]="'Send reset link' | t"
      [loading]="submitting()"
      [disabled]="submitting()"
    ></button>
  </div>
</form>
