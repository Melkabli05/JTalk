<app-auth-layout
  [locale]="locales.locale()"
  (localeChange)="locales.switchTo($event)"
  [heading]="'Reset your password' | t"
  [lead]="'Enter your email and we will send you a link to choose a new one.' | t"
>
  @if (sent()) {
    <p-message severity="success">
      {{ 'If that email address has an account, we have sent a link to reset the password.' | t }}
    </p-message>
  } @else {
    <app-forgot-password-form
      [submitting]="requesting.submitting()"
      [error]="requesting.error()"
      (requestReset)="requestReset($event)"
    />
  }
  <a pButton routerLink="/login" [text]="true" severity="secondary">{{ 'Back to sign in' | t }}</a>
</app-auth-layout>
