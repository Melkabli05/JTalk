<app-auth-layout
  [locale]="locales.locale()"
  (localeChange)="locales.switchTo($event)"
  [heading]="'Choose a new password' | t"
  [lead]="'Pick something long: a few words work well.' | t"
>
  @if (done()) {
    <p-message severity="success">{{
      'Your password was changed. You can sign in with it now.' | t
    }}</p-message>
    <a pButton routerLink="/login" [text]="true" severity="secondary">{{ 'Sign in' | t }}</a>
  } @else if (token()) {
    <app-reset-password-form
      [submitting]="resetting.submitting()"
      [error]="resetting.error()"
      (resetPassword)="resetPassword($event)"
    />
    <a pButton routerLink="/forgot-password" [text]="true" severity="secondary">{{
      'Need a new link?' | t
    }}</a>
  } @else {
    <p-message severity="error">{{
      'This reset link is incomplete. Request a new one.' | t
    }}</p-message>
    <a pButton routerLink="/forgot-password" [text]="true" severity="secondary">{{
      'Request a new link' | t
    }}</a>
  }
</app-auth-layout>
