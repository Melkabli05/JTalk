<button
  pButton
  type="button"
  size="small"
  [text]="true"
  severity="secondary"
  icon="pi pi-copy"
  [label]="copied() ? ('Copied' | t) : ('Copy' | t)"
  [attr.aria-label]="(copied() ? name().copied : name().copy) | t"
  [cdkCopyToClipboard]="text()"
  (cdkCopyToClipboardCopied)="copied.set($event)"
></button>
<span class="cdk-visually-hidden" role="status">{{ copied() ? (name().copied | t) : '' }}</span>
