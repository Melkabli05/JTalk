<label [for]="inputId">{{ label() }}</label>
<p-fluid>
  <p-password
    [inputId]="inputId"
    [autocomplete]="autocomplete()"
    [ngModel]="value()"
    (ngModelChange)="value.set($event ?? '')"
    [toggleMask]="true"
    [feedback]="false"
    [disabled]="disabled()"
    [invalid]="showErrors()"
    (onBlur)="touch.emit()"
  />
</p-fluid>
@if (hint(); as text) {
  <small class="hint" [id]="hintId">{{ text }}</small>
}
<app-field-errors [attr.id]="errorsId" [errors]="errors()" [visible]="showErrors()" />
