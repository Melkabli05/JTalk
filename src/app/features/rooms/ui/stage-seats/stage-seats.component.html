<ul
  class="stage"
  tabindex="-1"
  [class.scrolls]="scrolls()"
  aria-label="On stage"
  [attr.data-size]="avatarSize()"
>
  @for (speaker of onStage(); track speaker.member.id) {
    <li animate.enter="tile-in">
      <app-moderation-menu [name]="speaker.member.name" [items]="speaker.actions">
        <button
          type="button"
          class="tile person"
          [class.speaking]="speaker.speaking"
          aria-haspopup="dialog"
          [attr.aria-describedby]="
            speaker.speaking || speaker.muted ? `state-${speaker.member.id}` : null
          "
          [attr.aria-label]="
            speaker.me
              ? `${speaker.member.name} (you), ${speaker.role}`
              : `${speaker.member.name}, ${speaker.role}`
          "
          (click)="memberSelected.emit(speaker.member.id)"
        >
          <span class="portrait">
            <app-person-avatar
              size="xlarge"
              [member]="speaker.member"
              [speaking]="speaker.speaking"
              [reaction]="speaker.reaction"
            />
            @if (speaker.host) {
              <span class="star" aria-hidden="true"><i class="pi pi-star-fill"></i></span>
            }
            <span class="mic" [class.off]="speaker.muted" aria-hidden="true"
              ><i class="pi pi-microphone" [class.pi-slashed]="speaker.muted"></i
            ></span>
          </span>
          @if (speaker.speaking) {
            <span class="cdk-visually-hidden" [id]="`state-${speaker.member.id}`">Speaking</span>
          } @else if (speaker.muted) {
            <span class="cdk-visually-hidden" [id]="`state-${speaker.member.id}`">Muted</span>
          }
          <span class="name" aria-hidden="true">{{ speaker.member.name }}</span>
          <span class="role" aria-hidden="true">
            {{ speaker.host ? 'Host' : 'Speaker' }}
            @if (speaker.me) {
              · You
            }
          </span>
        </button>
      </app-moderation-menu>
    </li>
  }
  @if (nextSeat(); as seat) {
    <li animate.enter="tile-in">
      <button
        type="button"
        class="tile seat"
        [disabled]="!canTakeSeat()"
        [attr.aria-label]="`Take free seat ${seat} of ${seats()}`"
        (click)="seatTaken.emit()"
      >
        <span class="ring" aria-hidden="true"><i class="pi pi-plus"></i></span>
        <span class="open" aria-hidden="true">Open seat</span>
      </button>
    </li>
  }
</ul>
