<ul
  class="stage"
  tabindex="-1"
  [class.scrolls]="scrolls()"
  [attr.aria-label]="'On stage' | t"
  [attr.data-size]="avatarSize()"
>
  @for (speaker of onStage(); track speaker.member.id) {
    <li animate.enter="tile-in">
      <button
        type="button"
        class="tile person"
        [class.speaking]="speaker.speaking"
        aria-haspopup="dialog"
        [attr.aria-describedby]="
          speaker.speaking || speaker.muted ? `state-${speaker.member.id}` : null
        "
        [attr.aria-label]="
          speaker.me
            ? ('{name} (you), {role}' | t: { name: speaker.member.name, role: speaker.role | t })
            : ('{name}, {role}' | t: { name: speaker.member.name, role: speaker.role | t })
        "
        (click)="memberSelected.emit(speaker.member.id)"
      >
        <span class="portrait">
          <app-person-avatar
            [size]="avatarSize()"
            [member]="speaker.member"
            [speaking]="speaker.speaking"
          />
          @if (speaker.muted) {
            <span class="mic-off" aria-hidden="true"
              ><i class="pi pi-microphone pi-slashed"></i
            ></span>
          }
        </span>
        @if (speaker.speaking) {
          <span class="cdk-visually-hidden" [id]="`state-${speaker.member.id}`">{{
            'Speaking' | t
          }}</span>
        } @else if (speaker.muted) {
          <span class="cdk-visually-hidden" [id]="`state-${speaker.member.id}`">{{
            'Muted' | t
          }}</span>
        }
        <span class="name" aria-hidden="true">{{ speaker.member.name }}</span>
        @if (speaker.host || speaker.me) {
          <span class="role" aria-hidden="true">
            @if (speaker.host) {
              <i class="pi pi-crown"></i>{{ 'Host' | t }}
            }
            @if (speaker.host && speaker.me) {
              ·
            }
            @if (speaker.me) {
              {{ 'You' | t }}
            }
          </span>
        }
      </button>
    </li>
  }
  @if (nextSeat(); as seat) {
    <li animate.enter="tile-in">
      <button
        type="button"
        class="tile seat"
        [disabled]="!canTakeSeat()"
        [attr.aria-label]="
          'Take free seat {number} of {total}' | t: { number: seat, total: seats() }
        "
        (click)="seatTaken.emit()"
      >
        <span class="ring" aria-hidden="true"><i class="pi pi-plus"></i></span>
        <span class="open" aria-hidden="true">{{ 'Open seat' | t }}</span>
      </button>
    </li>
  }
</ul>
