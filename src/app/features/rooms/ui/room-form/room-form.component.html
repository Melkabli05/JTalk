<form class="form" [formRoot]="roomForm">
  @if (error(); as message) {
    <p-message severity="error">{{ message }}</p-message>
  }

  <app-text-field label="Title" [formField]="roomForm.title" />
  <app-text-field label="Topic" [formField]="roomForm.topic" />

  @if (!room()) {
    <div class="pair">
      <app-select-field
        label="I want to practise"
        [options]="languages"
        [formField]="roomForm.targetLanguage"
      />
      <app-select-field
        label="For speakers of"
        [options]="languages"
        [formField]="roomForm.nativeLanguage"
      />
    </div>
  }

  <app-select-field
    label="Stage seats, including you"
    [options]="seats"
    [formField]="roomForm.maxStageSeats"
  />

  <div class="actions">
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      label="Cancel"
      (click)="cancelled.emit()"
    ></button>
    <button
      pButton
      type="submit"
      [loading]="submitting()"
      [disabled]="submitting()"
      [label]="room() ? 'Save' : 'Open the room'"
    ></button>
  </div>
</form>
