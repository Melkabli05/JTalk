@let p = profile();
@let s = stats();
<mat-card
  class="profile-card profile-header-card"
  appearance="outlined"
  aria-labelledby="profileName"
>
  <div class="profile-cover" aria-hidden="true">
    <span class="cover-semicircle"></span>
  </div>
  <div class="profile-header-body">
    <div
      class="profile-avatar"
      id="profileHeaderAvatar"
      role="img"
      [attr.aria-label]="avatarAriaLabel()"
      style="background: var(--photo-bg)"
    >
      <app-avatar-art [imageUrl]="p?.avatarUrl ?? null" />
    </div>
    <h1 class="profile-name" id="profileName">{{ name() }}</h1>
    <p class="profile-meta">
      <span id="profileHandle">&#64;{{ username() }}</span> · Joined {{ joined() }}
    </p>
    <div class="profile-chips">
      <span class="profile-chip" id="profileSpeakChip">Speaks {{ speak() }}</span>
      @if (learn(); as learning) {
        <span class="profile-chip" id="profileLearnChip">Learning {{ learning }}</span>
      }
    </div>
    <div class="profile-stats">
      <span><b>{{ s?.followerCount ?? 0 }}</b> Followers</span>
      <span><b>{{ s?.followingCount ?? 0 }}</b> Following</span>
    </div>
    <div class="profile-header-actions">
      <button matButton="tonal" type="button" (click)="editProfile.emit()">
        <mat-icon aria-hidden="true">edit</mat-icon>
        Edit profile
      </button>
    </div>
  </div>
</mat-card>
