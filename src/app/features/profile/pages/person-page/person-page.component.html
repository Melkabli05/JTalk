@if (cards.card(); as card) {
  <app-profile-hero [person]="card.details" [details]="card.details">
    <div actions>
      @if (!card.isMe) {
        @if (card.social; as stats) {
          <app-follow-button
            [compact]="true"
            [following]="stats.followedByMe"
            [followsMe]="stats.followsMe"
            [busy]="cards.action.submitting()"
            (follow)="cards.follow()"
            (unfollow)="cards.unfollow()"
          />
        }
        @let moreLabel = 'More actions';
        <button
          pButton
          type="button"
          class="compact"
          icon="pi pi-ellipsis-h"
          severity="secondary"
          [rounded]="true"
          [text]="true"
          [attr.aria-label]="moreLabel"
          [pTooltip]="moreLabel"
          tooltipPosition="bottom"
          (click)="menu.toggle($event)"
        ></button>
        <p-menu
          #menu
          appendTo="body"
          [popup]="true"
          [ariaLabel]="moreLabel"
          [model]="moreActions()"
        />
      }
    </div>
    <div stats>
      @if (card.social; as stats) {
        <app-social-stats
          [followers]="stats.followers"
          [following]="stats.following"
          [followsMe]="stats.followsMe && !card.isMe"
        />
      }
    </div>
  </app-profile-hero>

  @if (cards.action.error(); as failure) {
    <p-message severity="error">{{ failure }}</p-message>
  }

  <app-profile-about [card]="card" />
} @else if (cards.failed()) {
  <p-message severity="error" icon="pi pi-exclamation-triangle">
    <span class="message">
      This profile could not be found.
      <a
        pButton
        routerLink="/"
        size="small"
        icon="pi pi-arrow-left"
        severity="danger"
        [text]="true"
        label="Back to the rooms"
      ></a>
    </span>
  </p-message>
} @else {
  <div class="loading">
    <p-progress-spinner ariaLabel="Finding their profile" />
  </div>
}

<p-confirmdialog />
