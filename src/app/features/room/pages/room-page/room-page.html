<div class="view view-room" [style.--room-kb-offset.px]="keyboardOffset()">
  @if (!isCurrentRoom() && (!facade.roomError() || facade.roomLoading())) {
    <div class="room-joining-state" role="status" aria-busy="true">
      <div class="room-joining-card">
        <p class="room-joining-label">{{ facade.leavingRoom() ? 'Leaving room…' : 'Joining room…' }}</p>
        <div class="room-joining-avatars" aria-hidden="true">
          @for (slot of [0, 1, 2, 3]; track slot) {
            <app-skeleton-loader variant="circle" width="52px" height="52px" />
          }
        </div>
        <app-skeleton-loader variant="text" width="60%" height="16px" />
        <app-skeleton-loader variant="text" width="40%" height="13px" />
      </div>
    </div>
  } @else if (!isCurrentRoom()) {
    <div class="rooms-empty-hint" role="alert">
      <p>{{ facade.roomError() }}</p>
      <div class="room-error-actions">
        <button matButton="tonal" type="button" id="retryJoinRoomBtn" (click)="facade.retryJoin(id())">
          <mat-icon aria-hidden="true">refresh</mat-icon>
          Try again
        </button>
        <button matButton="outlined" type="button" (click)="facade.navigateTo('/rooms')">
          <mat-icon aria-hidden="true">arrow_back</mat-icon>
          Back to live rooms
        </button>
      </div>
    </div>
  } @else {
    <div class="room-layout">
      <div class="room-head-col">
        <app-room-toolbar
          [roomTitle]="facade.effectiveRoomTitle()"
          [roomTopic]="facade.effectiveRoomTopic()"
          [practiseLang]="facade.practiseLangLabel()"
          [hostName]="facade.hostName()"
          [peopleCount]="facade.participantCount()"
          [handCount]="facade.handCount()"
          [isHost]="facade.isHost()"
          [pendingRequests]="facade.pendingRequests()"
          [audioStatus]="facade.audioStatus()"
          [noiseIsolationEnabled]="facade.noiseIsolationEnabled()"
          [noiseIsolationMode]="facade.noiseIsolationMode()"
          [audioInputDevices]="facade.audioInputDevices()"
          [selectedAudioInputId]="facade.selectedAudioInputId()"
          (backToRooms)="facade.navigateTo('/rooms')"
          (copyRoomLink)="facade.copyRoomLink()"
          (findPeople)="facade.navigateTo('/people')"
          (openEditRoom)="openEditRoomDialog()"
          (openEndRoom)="openEndRoomDialog()"
          (approveRequest)="facade.approveRequest(id(), $event)"
          (toggleNoiseIsolation)="facade.toggleNoiseIsolation()"
          (selectAudioDevice)="facade.selectAudioDevice($event)"
          (refreshAudioDevices)="facade.refreshAudioDevices()"
          (reconnectAudio)="facade.reconnectAudio(id())"
        />
      </div>

      <div class="room-top-col">
        <app-room-stage
          #roomStage
          [speakers]="facade.speakers()"
          [maxSeats]="facade.effectiveMaxSeats()"
          [stageReactions]="facade.stageReactions()"
          [speakerReactions]="facade.speakerReactions()"
          [isHost]="facade.isHost()"
          [hasOpenSeat]="facade.canClaimStageSeat()"
          [canUseMic]="facade.canUseMic()"
          [pinnedMessage]="facade.pinnedMessage()"
          (speakerAction)="onSpeakerAction($event)"
          (endRoom)="openEndRoomDialog()"
          (claimSeat)="facade.claimStageSeat(id())"
          (unpinMessage)="facade.unpinMessage(id())"
        />

        <app-room-audience
          [listeners]="facade.listeners()"
          listenerLabel="{{ facade.audienceCount() }} listening"
          [hasMore]="facade.hasMoreAudience()"
          [loading]="facade.audienceLoading()"
          [isHost]="facade.isHost()"
          (loadMore)="facade.loadMoreAudience(id())"
          (listenerAction)="onListenerAction($event)"
        />
      </div>

      <div class="room-chat-col">
        <app-room-discussion
          [messages]="facade.messages()"
          [sending]="facade.sendingComment()"
          [commentCountLabel]="facade.commentCountLabel()"
          [loading]="facade.messagesLoading()"
          [chatError]="facade.chatError()"
          [replyTarget]="facade.replyTarget()"
          [correcting]="facade.correcting()"
          [pinnedTopic]="facade.pinnedTopic()"
          [pinnedMessageId]="facade.pinnedMessageId()"
          (topicChange)="facade.updateChatTopic(id(), $event)"
          [isHost]="facade.isHost()"
          [mutedUsers]="facade.chatMutedUsers()"
          [canSend]="facade.canSendMessage()"
          (retryChat)="facade.retryChat()"
          (refreshChat)="facade.refreshChat()"
          (replyCleared)="facade.clearReplyTarget()"
          (sendMessage)="onSendMessage($event)"
          (emptySendAttempt)="facade.notify('Write something first.')"
          (toggleReaction)="facade.toggleMessageReaction(id(), $event.messageId, $event.reaction)"
          (commentAction)="facade.commentAction(id(), $event)"
          (openProfile)="onOpenCommentProfile($event)"
        />
      </div>

      <div class="room-dock-col">
        <app-room-controls
          [muted]="facade.muted()"
          [handRaised]="facade.handRaised()"
          [canEndRoom]="facade.isHost()"
          [canLeaveQuietly]="!facade.isHost() || facade.hasOtherParticipants()"
          [hasOtherParticipants]="facade.hasOtherParticipants()"
          [canLeaveStage]="facade.canLeaveStage()"
          [canUseMic]="facade.canUseMic()"
          [mutedByHost]="facade.mutedByHost()"
          [canRaiseHand]="facade.canRaiseHand()"
          [canClaimStageSeat]="facade.canClaimStageSeat()"
          [claimingSeat]="facade.claimingSeat()"
          [togglingHand]="facade.togglingHand()"
          [soundBlocked]="facade.soundBlocked()"
          [audioFailed]="facade.audioFailed()"
          [reconnectingAudio]="facade.reconnectingAudio()"
          [micError]="facade.micError()"
          (reactionPicked)="onStageReaction($event)"
          (toggleHand)="facade.toggleHand(id())"
          (claimStageSeat)="facade.claimStageSeat(id())"
          (toggleMute)="facade.toggleMute(id())"
          (enableAudio)="facade.enableAudio()"
          (reconnectAudio)="facade.reconnectAudio(id())"
          (leaveQuietly)="facade.leaveQuietly(id())"
          (leaveStage)="facade.leaveStage(id())"
          (openEndRoom)="openEndRoomDialog()"
        />
      </div>
    </div>
  }
</div>
