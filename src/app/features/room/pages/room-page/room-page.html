<div
  class="view view-room"
  [style.--room-kb-offset.px]="keyboardOffset()"
>
  @if (!isCurrentRoom() && (!roomStore.roomError() || roomStore.roomLoading())) {
    <p role="status">Joining room…</p>
  } @else if (!isCurrentRoom()) {
    <div class="rooms-empty-hint" role="alert">
      <p>{{ roomStore.roomError() }}</p>
      <button matButton="outlined" type="button" (click)="navigateTo('/rooms')">
        <mat-icon aria-hidden="true">arrow_back</mat-icon>
        Back to live rooms
      </button>
    </div>
  } @else {
    <div class="room-layout">
      <div class="room-head-col">
        <app-room-toolbar
          [roomTitle]="stageStore.effectiveRoomTitle()"
          [roomTopic]="roomStore.effectiveRoomTopic()"
          [practiseLang]="stageStore.practiseLangLabel()"
          [hostName]="stageStore.hostName()"
          [peopleCount]="stageStore.room()?.participantCount ?? 0"
          [handCount]="stageStore.room()?.handRaiseCount ?? 0"
          [isHost]="isHost()"
          [pendingRequests]="stageStore.pendingRequests()"
          [audioStatus]="roomStore.audio.status()"
          [noiseIsolationEnabled]="roomStore.audio.noiseIsolationEnabled()"
          [noiseIsolationMode]="roomStore.audio.noiseIsolationMode()"
          [audioInputDevices]="roomStore.audio.audioInputDevices()"
          [selectedAudioInputId]="roomStore.audio.selectedAudioInputId()"
          (backToRooms)="navigateTo('/rooms')"
          (copyRoomLink)="onCopyRoomLink()"
          (findPeople)="navigateTo('/people')"
          (openEditRoom)="openEditRoomDialog()"
          (openEndRoom)="openEndRoomDialog()"
          (logOut)="roomStore.signOut()"
          (leaveQuietly)="onLeaveQuietly()"
          (approveRequest)="onApproveRequest($event)"
          (toggleNoiseIsolation)="onToggleNoiseIsolation()"
          (selectAudioDevice)="onSelectAudioDevice($event)"
          (refreshAudioDevices)="roomStore.audio.refreshAudioInputDevices()"
          (reconnectAudio)="onReconnectAudio()"
        />
      </div>

      <div class="room-top-col">
        <app-room-stage
          #roomStage
          [speakers]="stageStore.speakers()"
          [maxSeats]="stageStore.effectiveMaxSeats()"
          [stageReaction]="stageStore.stageReaction()"
          [stageReactionKey]="stageStore.stageReactionKey()"
          [isHost]="isHost()"
          [hasOpenSeat]="stageStore.canClaimStageSeat()"
          [pinnedMessage]="chatStore.pinnedMessage()"
          (speakerAction)="onSpeakerAction($event)"
          (endRoom)="openEndRoomDialog()"
          (claimSeat)="onClaimStageSeat()"
          (unpinMessage)="onUnpinMessage()"
        />

        <app-room-audience
          [listeners]="stageStore.listeners()"
          listenerLabel="{{ stageStore.audienceCount() }} listening"
          [hasMore]="stageStore.hasMoreAudience()"
          [loading]="stageStore.audienceLoading()"
          [isHost]="isHost()"
          (loadMore)="onLoadMoreAudience()"
          (listenerAction)="onListenerAction($event)"
        />
      </div>

      <div class="room-chat-col">
        <app-room-discussion
          [messages]="chatStore.messages()"
          [sending]="sendingComment()"
          [commentCountLabel]="chatStore.commentCountLabel()"
          [loading]="roomStore.messagesLoading()"
          [chatError]="chatStore.chatError()"
          [replyTarget]="chatStore.replyTarget()"
          [correcting]="chatStore.correcting()"
          [pinnedTopic]="chatStore.pinnedTopic()"
          (topicChange)="onChatTopic($event)"
          [isHost]="isHost()"
          [mutedUsers]="chatStore.chatMutedUsers()"
          [canSend]="canSendMessage()"
          (retryChat)="onRetryChat()"
          (refreshChat)="onRefreshChat()"
          (replyCleared)="chatStore.setReplyTarget(null)"
          (sendMessage)="onSendMessage($event)"
          (emptySendAttempt)="toast.show('Write something first.')"
          (toggleReaction)="onToggleMessageReaction($event)"
          (commentAction)="onCommentAction($event)"
        />
      </div>

      <div class="room-dock-col">
        <app-room-controls
          [muted]="roomStore.muted()"
          [handRaised]="stageStore.handRaised()"
          [canEndRoom]="isHost()"
          [canLeaveStage]="canLeaveStage()"
          [canUseMic]="canUseMic()"
          [canRaiseHand]="canRaiseHand()"
          [canClaimStageSeat]="stageStore.canClaimStageSeat()"
          [soundBlocked]="roomStore.audio.soundBlocked()"
          [micError]="roomStore.audio.micError()"
          (reactionPicked)="onStageReaction($event)"
          (toggleHand)="onToggleHand()"
          (claimStageSeat)="onClaimStageSeat()"
          (toggleMute)="onToggleMute()"
          (enableAudio)="onEnableAudio()"
          (leaveQuietly)="onLeaveQuietly()"
          (leaveStage)="onLeaveStage()"
          (openEndRoom)="openEndRoomDialog()"
        />
      </div>
    </div>
  }
</div>
