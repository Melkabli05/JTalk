<h2 mat-dialog-title id="endModalTitle">
  @if (roomTitle) {
    End “{{ roomTitle }}” for everyone?
  } @else {
    End room for everyone?
  }
</h2>
<mat-dialog-content>
  <p>Closes the room immediately and disconnects all participants.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton="text" type="button" mat-dialog-close>Cancel</button>
  <button
    matButton="filled"
    class="btn-danger-filled"
    type="button"
    id="confirmEndRoom"
    [mat-dialog-close]="true"
  >
    End room
  </button>
</mat-dialog-actions>
