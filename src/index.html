<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Jtalk</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function () {
        try {
          var direction = localStorage.getItem('jtalk:direction');
          if (direction === 'rtl') document.documentElement.dir = 'rtl';
          var saved = localStorage.getItem('jtalk:color-scheme');
          var dark =
            saved === 'dark' ||
            ((saved === null || saved === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('app-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
